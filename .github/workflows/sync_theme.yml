name: sync theme submodules

# no permissions by default
permissions: {}

on:
  push:
    branches: gh-pages

  schedule:
     - cron: "00 14 * * *"

  workflow_dispatch:

jobs:
  sync_theme_submodules:
    if: github.repository_owner == 'ioos' # only run if ioos owns repo
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: gh-pages
        fetch-depth: 0
        persist-credentials: false
        submodules: recursive

    - name: Update submodules
      id: update_submodules
      run: >
          git submodule update --remote --merge
          && git diff --quiet origin/main -- "theme" || echo "theme=true" >> $GITHUB_OUTPUT
          && git diff --quiet origin/main -- "_data/navbars" || echo "navbars=true" >> $GITHUB_OUTPUT

    - name: Create PR if it changed
      if: ${{ (steps.update_theme_submodule.outputs.theme != 'true') && (steps.update_theme_submodule.outputs.navbars != 'true') }}
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  #v8.1.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "Update theme"
        branch: "theme_update"
        title: "Update theme submodule"
        body: "This PR updates the theme submodule."
        delete-branch: true
        labels: Bot
